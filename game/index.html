<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Makeup</title>
<link rel="icon" href="data:,">
<!--HOST-->
<style>
  /* Blush Studio (owner's choice, 19 October 2026). Haircut's controls, recoloured: round "sticker" buttons with an
     ink outline and a hard shadow that presses down, a video badge on everything that plays a video, a rosette seal
     for Done. Textless: icons, numbers and pictures only; spoken labels (aria-label) carry the words. */
  :root { --ink: #2a1d15; --panel: #fff6e6; --accent: #ff7aa8; --seal: #5ccf72; --badge: #ffb627;
    --edge: 0 4px 0 var(--ink); --edge-down: 0 1px 0 var(--ink); --outline: 3px solid var(--ink);
    --wall: radial-gradient(120% 80% at 50% 30%, #fbe4de 0, #f1c8c3 55%, #dfa9ab 100%);
    font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif; }
  html, body { margin: 0; height: 100%; background: #e9c9c4; color: var(--ink); }
  body { overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  [hidden] { display: none !important; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* the salon behind the customer: a blush wall and a lit vanity mirror */
  #backdrop { position: absolute; inset: 0; overflow: hidden; z-index: -1; background: var(--wall); }
  #backdrop > * { position: absolute; }
  .mirror { left: 7%; right: 7%; top: 5%; bottom: 20%; border-radius: 46% 46% 22px 22px / 26% 26% 22px 22px;
    background: linear-gradient(160deg, #fdf3f0 0, #f3dcd8 45%, #ecccc8 100%); border: 14px solid #fbefe4; box-shadow: inset 0 0 0 3px #e7cbb3, 0 8px 30px #9a5b5b33; filter: blur(1px); }
  .bulbs { --b: radial-gradient(circle, #fffdf3 0 5px, #ffe2a6 6px, #ffd78a55 11px, #0000 17px); }
  .bulbs.l, .bulbs.r { top: 16%; bottom: 24%; width: 36px; background: var(--b) center 0 / 36px 54px repeat-y; }
  .bulbs.l { left: calc(7% - 11px); } .bulbs.r { right: calc(7% - 11px); }
  .bulbs.t { top: 3%; left: 22%; right: 22%; height: 36px; background: var(--b) 0 center / 54px 36px repeat-x; }

  /* ---- controls ---- */
  #top { display: flex; align-items: flex-start; justify-content: space-between; padding: max(10px, env(safe-area-inset-top)) 12px 4px; min-height: 80px; box-sizing: border-box; }
  #stage { flex: 1; min-height: 0; display: flex; justify-content: center; overflow: hidden; position: relative; }
  canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  .ctl { position: relative; display: grid; place-items: center; padding: 0; border: var(--outline); background: var(--panel); color: var(--ink);
    box-shadow: var(--edge); transition: transform .08s, box-shadow .08s; touch-action: manipulation; }
  .ctl:not(:disabled):active { transform: translateY(3px); box-shadow: var(--edge-down); }
  .ctl:disabled { opacity: .55; }
  .ctl svg { width: 26px; height: 26px; }
  .round { width: 52px; height: 52px; border-radius: 50%; }
  .dot { position: absolute; top: -3px; right: -3px; width: 14px; height: 14px; border-radius: 50%; background: #ff3b30; border: 2.5px solid var(--ink); }
  .vbadge { position: absolute; right: -6px; bottom: -5px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: var(--badge); border: 2.5px solid var(--ink); box-shadow: 0 2px 0 var(--ink); }
  .vbadge svg { width: 15px !important; height: 15px !important; }
  /* Done: the rosette seal (top right), the size of the daily button */
  #done { width: 56px; height: 56px; border: 0; background: none; box-shadow: none; }
  #done .seal { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 4px 0 var(--ink)); }
  #done .seal polygon { fill: var(--seal); stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; }
  #done > svg:not(.seal) { position: relative; width: 26px; height: 26px; }
  #done.pop { animation: pop .35s ease-out; }
  @keyframes pop { 40% { transform: scale(1.35) rotate(12deg); } 100% { transform: scale(1); } }
  #done:not(:disabled):active { transform: translateY(3px); }
  #done:not(:disabled):active .seal { filter: drop-shadow(0 1px 0 var(--ink)); }
  /* the controls sit on the vanity counter in front of the customer (it hides where the body ends); create and review
     share one height, so the face never moves */
  footer { height: calc(146px + env(safe-area-inset-bottom)); box-sizing: border-box; padding: 6px 8px env(safe-area-inset-bottom); position: relative;
    background: linear-gradient(#fffaf6 0 7px, #f4e3d7 7px, #e8d0c0 100%); box-shadow: 0 -10px 18px -10px #6a3a3a55; }
  #swatches { display: flex; gap: 8px; overflow-x: auto; padding: 8px 10px 10px; justify-content: safe center; scrollbar-width: none; }
  #swatches button { position: relative; flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; border: var(--outline); box-shadow: 0 3px 0 var(--ink); padding: 0; transition: transform .1s; }
  #swatches button[aria-checked="true"] { transform: translateY(-4px) scale(1.12); box-shadow: 0 0 0 3px var(--panel), 0 0 0 6px var(--ink), 0 6px 0 3px var(--ink); }
  #swatches .star { position: absolute; right: -7px; top: -7px; width: 20px; height: 20px; }
  #toolbar { display: flex; justify-content: center; gap: 10px; padding-top: 4px; }
  #toolbar .ctl { width: 56px; height: 56px; border-radius: 50%; }
  #toolbar .ctl[aria-pressed="true"] { background: var(--accent); transform: translateY(-3px) scale(1.08); box-shadow: 0 6px 0 var(--ink); }
  /* review, as Haircut's completion: the top buttons give way (the eye for the before takes the corner); on the
     counter, Retry for a video and the next customer, pictured, docked against the Next arrow */
  body.review #daily, body.review #done { display: none; }
  #before { display: none; }
  body.review #before { display: grid; }
  #before[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
  #review { display: flex; gap: 22px; justify-content: center; align-items: center; }
  #review > * { animation: rise .45s .25s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } }
  #redo { width: 72px; height: 72px; animation: rise .45s .25s ease-out both, breathe 1.3s .7s ease-in-out infinite; }
  #redo > svg { width: 34px; height: 34px; }
  #redo .vbadge { width: 32px; height: 32px; right: -8px; bottom: -6px; }
  #redo .vbadge svg { width: 19px !important; height: 19px !important; }
  @keyframes breathe { 50% { transform: scale(1.06); } }
  #next { display: flex; align-items: center; gap: 10px; height: 96px; padding: 0 10px 0 6px; border-radius: 26px; }
  #next .pic { display: block; width: 84px; height: 84px; border-radius: 20px; border: 2.5px solid var(--ink); background: radial-gradient(circle at 50% 35%, #fff6e6, #ecd2c4); overflow: hidden; }
  #next .pic canvas { display: block; width: 100%; height: 100%; }
  #next .go { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); border: var(--outline); box-shadow: 0 3px 0 var(--ink); }
  #next .go svg { width: 30px; height: 30px; }
  /* the finish: sparkles burst from the face */
  #fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #fx i { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); background: var(--c); border: 2px solid var(--ink); border-radius: var(--r);
    clip-path: var(--clip, none); animation: burst var(--t) cubic-bezier(.2, .7, .3, 1) forwards; }
  @keyframes burst { 0% { transform: translate(-50%, -50%) scale(.2); opacity: 1; }
    70% { opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(1); opacity: 0; } }
  #fx .glow { position: absolute; left: 50%; top: 42%; width: 70%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle, #fff9 0, #fff0 65%); animation: glow .9s ease-out forwards; }
  @keyframes glow { from { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 30% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -50%) scale(1.3); } }
  #notice { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--panel); border: var(--outline); box-shadow: 0 3px 0 var(--ink); }
  #notice svg { width: 22px; height: 22px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ---- the colour of the day: the tool in the new colour, one button, the time left ---- */
  #panel { position: fixed; inset: 0; background: #2a1d1566; display: grid; place-items: center; padding: 16px; }
  #panel .card { position: relative; width: min(290px, 100%); box-sizing: border-box; background: var(--panel); border: var(--outline); border-radius: 28px;
    box-shadow: 0 6px 0 var(--ink); padding: 22px 20px 18px; text-align: center; }
  #panel .x { position: absolute; right: -14px; top: -14px; width: 48px; height: 48px; }
  #panel .x svg { width: 22px; height: 22px; }
  #panel .art { position: relative; width: 224px; height: 224px; margin: 0 auto 16px; border-radius: 30px; border: var(--outline); box-shadow: 0 4px 0 var(--ink); overflow: hidden;
    background: radial-gradient(120% 90% at 50% 20%, #fbe4de 0, #e9bdb9 100%); }
  #panel .art > svg { display: block; width: 100%; height: 100%; }
  #panel .art .tick { position: absolute; right: 8px; bottom: 8px; width: 48px; height: 48px; border-radius: 50%; background: var(--seal); border: var(--outline); display: grid; place-items: center; box-shadow: 0 3px 0 var(--ink); }
  #panel .art .tick svg { width: 26px; height: 26px; }
  #panel .get { width: 100%; height: 70px; border-radius: 35px; background: var(--accent); }
  #panel .get .vb { display: grid; place-items: center; width: 50px; height: 50px; border-radius: 50%; background: var(--badge); border: var(--outline); }
  #panel .get .vb svg { width: 28px; height: 28px; }
  #panel .get > svg { width: 38px; height: 38px; }
  #panel .get.owned { background: var(--seal); }
  #panel .time { display: inline-flex; margin-top: 14px; gap: 6px; align-items: center; padding: 4px 12px; border-radius: 16px; border: 2.5px solid var(--ink); background: #fff8;
    font-weight: 800; font-variant-numeric: tabular-nums; font-size: 15px; }
  #panel .time svg { width: 18px; height: 18px; }
  .nope { animation: nope .4s; }
  @keyframes nope { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* ---- loading and recovery ---- */
  #cover, #error { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 18px; padding: 24px; background: var(--wall); }
  .spin { width: 46px; height: 46px; border-radius: 50%; border: var(--outline); background: conic-gradient(var(--accent) 0 30%, var(--panel) 0); box-shadow: 0 4px 0 var(--ink); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error .oops { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: var(--outline); box-shadow: var(--edge); }
  #error .oops svg { width: 46px; height: 46px; }
  #retry { width: 84px; height: 84px; border-radius: 50%; background: var(--accent); }
  #retry svg { width: 40px; height: 40px; }
  #error-code { font: 600 11px ui-monospace, monospace; opacity: .5; } /* a diagnostic code, not words for the player */
  @media (prefers-reduced-motion: reduce) { .spin, .nope, #notice svg, #redo, #review > *, #panel .art svg, #done.pop { animation: none; } #fx { display: none; } .ctl, #swatches button { transition: none; } }
  @media (max-height: 560px) { #top { min-height: 64px; } footer { height: calc(118px + env(safe-area-inset-bottom)); } #swatches { padding-bottom: 4px; }
    .round { width: 46px; height: 46px; } #toolbar .ctl { width: 48px; height: 48px; } #done { width: 50px; height: 50px; }
    #redo { width: 60px; height: 60px; } #next { height: 78px; } #next .pic { width: 66px; height: 66px; } #next .go { width: 48px; height: 48px; } }
</style>
</head>
<body>
<div id="app">
  <div id="backdrop" aria-hidden="true"><div class="mirror"></div><i class="bulbs l"></i><i class="bulbs r"></i><i class="bulbs t"></i></div>
  <header id="top">
    <button id="daily" class="ctl round" aria-label="Colour of the day" hidden></button>
    <button id="before" class="ctl round" aria-pressed="false" aria-label="Hold to see before"></button>
    <span></span>
    <button id="done" class="ctl" aria-label="Done"></button>
  </header>
  <main id="stage"><div id="fx" aria-hidden="true"></div><div id="notice" role="status" aria-label="Not saved yet. Retrying." hidden></div></main>
  <footer id="create"><div id="swatches" role="radiogroup" aria-label="Colours"></div><div id="toolbar" role="toolbar" aria-label="Makeup tools"></div></footer>
  <footer id="review" hidden>
    <button id="redo" class="ctl round" aria-label="Do this face again: watch a video" hidden></button>
    <button id="next" class="ctl" aria-label="Next customer"><span class="pic"></span><span class="go"></span></button>
  </footer>
</div>
<div id="panel" role="dialog" aria-modal="true" aria-label="Colour of the day" hidden>
  <div class="card">
    <button class="x ctl round" aria-label="Close"></button>
    <div class="art" role="img"></div>
    <button class="get ctl"></button>
    <div class="time" role="timer"></div>
  </div>
</div>
<div id="cover" aria-label="Loading"><div class="spin"></div></div>
<div id="error" role="alert" aria-label="Something went wrong. Your saved looks are safe." hidden><div class="oops"></div><button id="retry" class="ctl" aria-label="Retry"></button><small id="error-code"></small></div>
<script type="module" src="main.js"></script>
</body>
</html>
