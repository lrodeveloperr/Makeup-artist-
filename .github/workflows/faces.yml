name: faces

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  faces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Head asset is reproducible from the pinned CC0 sources
        run: |
          node tools/makehuman/fetch.mjs
          cp assets/head.bin.gz /tmp/head.committed.bin.gz
          node tools/makehuman/build-head.mjs
          cmp assets/head.bin.gz /tmp/head.committed.bin.gz
          node tools/makehuman/impact.mjs
          git diff --exit-code src/face/dim-impact.js
      - name: Unit tests and face audit
        run: |
          node tests/unit.mjs
          node tests/face-audit.mjs 2000 300
          git diff --exit-code docs/FACE-AUDIT.md docs/face-audit.json
      - name: Download size budget
        run: node tests/size-budget.mjs
      - name: Browser render smoke test
        run: |
          npx playwright install --with-deps chromium
          node tools/build-preview.mjs
          node tests/render-smoke.mjs
