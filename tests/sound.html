<!doctype html><meta charset="utf-8"><title>Sound check</title>
<script type="module">
// Renders the game's sounds offline (tests/sound.mjs drives it): each tool brushed back and forth at a known tempo,
// paused, then swept slowly; the taps; the controls; the finish. Returns the audio and when each stroke unit began
// (attacks: the units that begin a movement, not those carrying a long sweep on).
import * as S from '../game/sound.js';
import { colourById } from '../src/makeup/palette.js';
const sr = 44100, dt = 1 / 120, PX = 110; // pointer samples a second; pixels a decimetre (a phone's framing)
S.preload('../build/game/');
// a hand: `sweeps` turns of `len` seconds each at `speed` dm/s, starting at t; returns when each sweep began
function brush(v, t, sweeps, len, speed) {
  const turns = [];
  for (let n = 0; n < sweeps; n++) {
    turns.push(t);
    for (let u = 0; u < len; u += dt, t += dt) v.move(speed * dt, dt, true, (n % 2 ? -1 : 1) * speed * dt * PX, 0, t);
  }
  return { turns, t };
}
const TAKES = {
  stroke(tool, id) {
    const v = S.stroke(tool, colourById(id));
    const first = brush(v, 0.05, 6, 0.3, 1.4);               // brushing back and forth
    const pause = [first.t, first.t + 0.5];                 // the hand rests on the face
    const second = brush(v, first.t + 0.5, 2, 0.7, 0.8);    // two long, slow sweeps
    // the finger slips back a couple of pixels as it lifts: no new sound (owner: the process only)
    let t = second.t;
    for (let k = 0; k < 3; k++, t += dt) v.move(0.8 * 0.7 / PX, dt, true, 0.7, 0, t);
    v.end(t);
    // a touch that barely moves: no sound at all
    const touch = S.stroke(tool, colourById(id)), jiggle = t + 0.3;
    for (let k = 0; k < 4; k++) touch.move(0.6 / PX, dt, true, k % 2 ? -0.6 : 0.6, 0, jiggle + k * dt);
    touch.end(jiggle + 4 * dt);
    return { turns: [...first.turns, ...second.turns], pause, slip: second.t, end: jiggle + 0.5 };
  },
  gems(t) { ['gem-crystal', 'gem-aurora', 'gem-pearl', 'gem-gold-star'].forEach((id, k) => S.tap('gem', colourById(id), t + k * 0.7)); return { end: t + 2.9 }; },
  lens(t) { S.tap('lens', null, t); S.tap('lens', null, t + 0.6); return { end: t + 1.1 }; },
  controls(t) { S.ui('tool', t); S.ui('colour', t + 0.5); S.ui('panel', t + 1); S.ui('next', t + 1.5); S.ui('tick', t + 2.1); S.ui('tock', t + 2.4); S.ui('unwrap', t + 2.8); S.ui('nope', t + 5.2); return { end: t + 5.6 }; },
  finish(t) { S.chime(true, t); return { end: t + 2 }; },
};
window.render = async (name, tool, colour) => {
  const ctx = new OfflineAudioContext(1, sr * 6, sr);
  S.useContext(ctx);
  await S.ready();
  const log = []; S.logUnits(log);
  const take = tool ? TAKES.stroke(tool, colour) : TAKES[name](0.05);
  S.logUnits(null);
  const d = (await ctx.startRendering()).getChannelData(0).slice(0, Math.ceil(take.end * sr));
  let bin = ''; new Uint8Array(new Float32Array(d).buffer).forEach((x) => (bin += String.fromCharCode(x)));
  return { ...take, starts: log.map(([, t]) => t), attacks: log.filter(([, , legato]) => !legato).map(([, t]) => t), units: S.stats.units, pcm: btoa(bin) };
};
window.ready = true;
</script>
